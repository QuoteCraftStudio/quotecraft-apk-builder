name: Package Windows EXE

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'web/**'
      - 'templates/**'
      - '.github/workflows/package-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Compile Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name QuoteCraft-APK-Builder --add-data "web;web" --add-data "templates;templates" desktop.py
      - name: Save Windows download
        uses: actions/upload-artifact@v4
        with:
          name: QuoteCraft-APK-Builder-Windows
          path: |
            dist/QuoteCraft-APK-Builder.exe
            START-HERE.md
            Install-Gradle.ps1
          if-no-files-found: error
          retention-days: 14

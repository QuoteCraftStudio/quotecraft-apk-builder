<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline test</title><style>body{font:18px system-ui;margin:0;background:#f2f6f4;color:#183a30;padding:32px}main{max-width:500px;margin:auto}button{background:#17634d;color:white;border:0;border-radius:12px;padding:16px;font:inherit}small{display:block;margin-top:24px}</style><main><h1>Built on my phone</h1><p>This page has no external files or network requests.</p><button id="tap">Tap to test</button><p id="count"></p><small>Close and reopen this app. The count should remain saved on your phone.</small></main><script>let n=Number(localStorage.getItem('count')||0);function show(){document.getElementById('count').textContent='Saved taps: '+n}document.getElementById('tap').onclick=()=>{localStorage.setItem('count',++n);show()};show();</script></html>
